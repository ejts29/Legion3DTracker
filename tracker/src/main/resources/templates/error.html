<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - Legión 3D Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0a0a0a; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; align-items: center; justify-content: center; min-vh-100; margin: 0; }
        .error-container { max-width: 600px; text-align: center; padding: 40px; background: #111; border: 1px solid #333; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .error-icon { font-size: 4rem; color: #F2C05F; margin-bottom: 20px; }
        h1 { color: #F2C05F; font-weight: 700; margin-bottom: 20px; }
        p { font-size: 1.1rem; line-height: 1.6; margin-bottom: 30px; }
        .btn-gold { background-color: #F2C05F; color: black; border: none; border-radius: 50px; padding: 12px 30px; font-weight: 700; text-decoration: none; transition: 0.3s; display: inline-block; }
        .btn-gold:hover { background-color: #d9ac55; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(242, 192, 95, 0.2); }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h1 th:text="${titulo != null ? titulo : 'Inconveniente detectado'}">Error en el sistema</h1>
        <p th:text="${mensaje != null ? mensaje : 'Lo sentimos, ha ocurrido un error inesperado en el procesamiento de su solicitud.'}">
            Ha ocurrido un error inesperado.
        </p>
        <a href="/" class="btn-gold">VOLVER AL DASHBOARD</a>
    </div>
</body>
</html>
