<!DOCTYPE html>
<!-- LEGIÓN 3D TRACKER : BARRA LATERAL DE NAVEGACIÓN (SIDEBAR)
     Este componente representa la columna vertebral de la navegación administrativa. 
     Organiza el flujo de trabajo y contiene herramientas críticas de productividad.
-->
<html xmlns:th="http://www.thymeleaf.org">
        <style>

    /* =========================================================
   REDUCCIÓN  (90% ZOOM)
   Al achicar la fuente raíz, todo el ecosistema de Bootstrap 
   (botones, márgenes, textos) se encoge proporcionalmente.
   ========================================================= */
html {
    font-size: 90% !important; 
}


            /* DINÁMICA DE INTERACCIÓN Y EXPERIENCIA DE USUARIO (UX) */
            .sidebar .nav-link { transition: all 0.2s ease-in-out; }
            .sidebar .nav-link:hover {
                background-color: rgba(242, 192, 95, 0.1) !important;
                color: #ffffff !important;
                transform: translateX(5px);
            }
            .sidebar .nav-link:active {
                background-color: rgba(242, 192, 95, 0.2) !important;
                transform: scale(0.98);
            }
            .btn-calcular { transition: transform 0.1s ease; border: none; }
            .btn-calcular:active { transform: scale(0.95); background-color: #d8aa53 !important; }
        
            /* Aniquilar flechas de incremento en TODOS los inputs numéricos del sistema */
input[type=number]::-webkit-inner-spin-button, 
input[type=number]::-webkit-outer-spin-button { 
    -webkit-appearance: none; 
    margin: 0; 
}
input[type=number] { 
    -moz-appearance: textfield; 
}
        
        </style>

        <body>
    <nav th:fragment="sidebar" id="sidebarMenu"
        class="col-md-3 col-lg-2 d-md-block sidebar min-vh-100 collapse text-center"
        style="background-color: #000000 !important; border-right: 1px solid #252525;">



        <!-- CONTENEDOR ESTÁTICO: BRANDING Y NAVEGACIÓN -->
        <div class="pt-3">
            <h5 class="mt-3 fw-bold" style="color: #F2C05F;">LEGIÓN 3D</h5>
            <span class="badge border border-warning text-warning mb-5" style="font-size: 0.6rem;">SISTEMA TRACKER</span>

            <ul class="nav flex-column text-start">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}" style="color: #c4c2c2 !important; padding: 12px 25px; display: block; text-decoration: none;">
                        <i class="fas fa-th-large me-2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/solicitudes/triaje}" style="color: #c4c2c2 !important; padding: 12px 25px; display: block; text-decoration: none;">
                        <i class="fas fa-inbox me-2"></i> Solicitudes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/solicitudes/revision-datos-tecnicos}" style="color: #c4c2c2 !important; padding: 12px 25px; display: block; text-decoration: none;">
                        <i class="fas fa-microchip me-2"></i> Datos Técnicos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/solicitudes/cotizaciones}" style="color: #c4c2c2 !important; padding: 12px 25px; display: block; text-decoration: none;">
                        <i class="fas fa-file-invoice-dollar me-2"></i> Cotizaciones
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/solicitudes/produccion}" style="color: #c4c2c2 !important; padding: 12px 25px; display: block; text-decoration: none;">
                        <i class="fas fa-hammer me-2"></i> Producción
                    </a>
                </li>
                <hr class="mx-3" style="border-color: #333;">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/solicitudes/historial}" style="color: #c4c2c2 !important; padding: 12px 25px; display: block; text-decoration: none;">
                        <i class="fas fa-history me-2"></i> Historial
                    </a>
                </li>
            </ul>
        </div>

        <!-- BLOQUE DE HERRAMIENTAS MAGNÉTICO (STICKY)
             Agrupamos la calculadora y el acceso rápido en un solo contenedor pegajoso.
             Esto permite que ambas herramientas sigan el scroll de la página principal
             de forma sincronizada y fluida.
        -->
        <div style="position: sticky; top: 20px; z-index: 100;">
            
            <!-- HERRAMIENTA: CALCULADORA DE DÍAS HÁBILES -->
            <div class="mx-3 mt-4 p-3 border border-secondary rounded bg-black text-start mb-3">
                <small class="fw-bold d-block mb-2" style="font-size: 0.65rem; color: #F2C05F;">CALCULADORA DÍAS HÁBILES</small>
                <div class="mb-2">
                    <label class="text-muted" style="font-size: 0.6rem;">FECHA INICIO</label>
                    <input type="date" id="fechaInicial" class="form-control form-control-sm" style="background-color: #0a0a0a; border: 1px solid #333; color: white;">
                </div>
                <div class="mb-2">
                    <label class="text-muted" style="font-size: 0.6rem;">DÍAS DE TRABAJO</label>
                    <input type="number" id="diasSumar" class="form-control form-control-sm" style="background-color: #0a0a0a; border: 1px solid #333; color: white;" placeholder="Ej: 5">
                </div>
                <button type="button" onclick="calcularFecha()" class="btn btn-sm w-100 btn-calcular" style="background-color: #F2C05F; color: #000; font-weight: 800; font-size: 0.75rem;">CALCULAR</button>
                <div id="resultadoFecha" class="mt-2 text-white pt-2" style="font-size: 0.75rem; display: none; border-top: 1px solid #333;">
                    Entrega: <span class="fw-bold text-warning" id="fechaFinal"></span>
                </div>
            </div>

            <!-- HERRAMIENTA: PUENTE DE SOPORTE Y GESTIÓN FINANCIERA (F2) -->
            <div class="mx-3 mt-4 p-3 border border-secondary rounded bg-black text-start">
                <small class="fw-bold d-block mb-2" style="font-size: 0.65rem; color: #F2C05F;">ACCESO RÁPIDO</small>
                <small class="fw-bold d-block mb-2" style="font-size: 0.65rem; color: #F2C05F;">(ID CLIENTE )</small>

                <div class="mb-2">
                    <input type="text" id="sidebarTrackingInput" class="form-control form-control-sm" style="background-color: #0a0a0a; border: 1px solid #333; color: white; font-size: 0.7rem;" placeholder="Pegue LEG-XXXX">
                </div>

                <div class="d-grid gap-1">
                    <button type="button" class="btn btn-sm btn-outline-warning" onclick="irARuta('')" style="font-size: 0.65rem;">
                        <i class="fas fa-search me-1"></i> TRACKING
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-info" onclick="irARuta('/formulario')" style="font-size: 0.65rem;">
                        <i class="fas fa-edit me-1"></i> FORMULARIO
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-success" onclick="window.buscarPedidoParaPagoManual()" style="font-size: 0.65rem;">
                        <i class="fas fa-cash-register me-1"></i> PAGO MANUAL
                    </button>
                </div>
            </div>
        </div>

        <!-- LÓGICA DE NAVEGACIÓN Y MOTOR FINANCIERO -->
        <script th:inline="javascript">
            function irARuta(sufijo) {
                const id = document.getElementById('sidebarTrackingInput').value.trim();
                if (id) window.open(`/tracking/${id}${sufijo}`, '_blank');
                else Swal.fire({ icon: 'warning', title: 'Atención', text: 'Por favor, ingresa un código.' });
            }

            window.buscarPedidoParaPagoManual = async function () {
                const input = document.getElementById('sidebarTrackingInput');
                if (!input) return;
                const trackingValue = input.value.trim().toUpperCase();
                if (!trackingValue) return Swal.fire({ icon: 'warning', text: 'Ingresa un código LEG-XXXX.' });

                Swal.fire({ title: 'Buscando...', didOpen: () => Swal.showLoading() });

                try {
                    const response = await fetch(`/api/v1/pedidos/tracking/${trackingValue}`);
                    if (!response.ok) throw new Error();
                    const pedido = await response.json();
                    Swal.close();

                    if (pedido.precioFinal === 0 || trackingValue.endsWith('-G')) {
                        Swal.fire({ icon: 'info', title: 'Garantía', text: 'Costo $0, no requiere registro de pago.' });
                        return;
                    }

                    if (window.abrirModalPagoManualConfigurado) {
                        window.abrirModalPagoManualConfigurado(pedido.id, pedido.codigoSeguimiento, pedido.precioFinal);
                    } else {
                        Swal.fire({ icon: 'error', title: 'Error', text: 'El Módulo Financiero solo está disponible en Producción.' });
                    }
                } catch (error) {
                    Swal.fire({ icon: 'error', text: 'El pedido ' + trackingValue + ' no existe.' });
                }
            };

            function calcularFecha() {
                let fechaInput = document.getElementById('fechaInicial').value;
                let dias = parseInt(document.getElementById('diasSumar').value);
                if (!fechaInput || isNaN(dias)) return;

                let d = new Date(fechaInput + 'T12:00:00');
                let cont = 0;
                while (cont < dias) {
                    d.setDate(d.getDate() + 1);
                    if (d.getDay() !== 0 && d.getDay() !== 6) cont++;
                }
                const opciones = { weekday: 'long', day: 'numeric', month: 'long' };
                let fechaTexto = d.toLocaleDateString('es-CL', opciones);
                document.getElementById('fechaFinal').innerText = fechaTexto.charAt(0).toUpperCase() + fechaTexto.slice(1);
                document.getElementById('resultadoFecha').style.display = 'block';
            }
        </script>
    </nav>
</body>
</html>
